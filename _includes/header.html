<div id="header">
	<img src="https://github.com/identicons/wombathead.png" width=1em>
	{{ site.title }}
	{% assign sortedPages = site.pages | sort:"navOrder" %}
	<ul id="navbar">
		{% for page in sortedPages %}
		{% if page.navOrder %}
		<li><a href="{{ page.url }}">{{ page.title }}</a></li>
		{% endif %}
		{% endfor %}
	</ul>
</div>
